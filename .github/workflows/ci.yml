name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:  # main ruleset의 필수 검사 이름. 바꾸면 ruleset도 함께 바꾼다(docs/decisions/001)
    runs-on: ubuntu-24.04  # latest가 10/19부터 Ubuntu 26으로 바뀌어 기간 중 고정
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: worth_joining_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql+asyncmy://root:test@127.0.0.1:3306/worth_joining_test
      DATABASE_URL_SYNC: mysql+pymysql://root:test@127.0.0.1:3306/worth_joining_test
      TEST_DATABASE_URL: mysql+asyncmy://root:test@127.0.0.1:3306/worth_joining_test
      DB_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic heads
      - run: pytest -v

  web:  # 필수 검사는 아니다(ruleset은 test만). 웹 lint · 타입 · 빌드가 깨지지 않았는지 본다
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # API 계약(app/schemas)이 바뀌었는데 npm run gen:api를 잊으면 web 타입이 어긋난다. 다시 만들어 비교한다
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: API 타입이 백엔드와 같은지
        working-directory: .
        env:
          DATABASE_URL: mysql+asyncmy://u:p@db:3306/x
          DATABASE_URL_SYNC: mysql+pymysql://u:p@db:3306/x
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e .
          (cd web && npm run gen:api)
          git diff --exit-code -- web/lib/api || (echo "::error::web/lib/api가 백엔드와 다르다. npm run gen:api를 실행해 커밋한다" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api-image:  # 필수 검사는 아니다. Railway가 빌드할 Dockerfile이 깨지지 않았는지 본다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t worth-joining-api .
      - name: 앱을 불러올 수 있는지 (DB 연결 없이)
        run: >-
          docker run --rm
          -e DATABASE_URL=mysql+asyncmy://u:p@db:3306/x
          -e DATABASE_URL_SYNC=mysql+pymysql://u:p@db:3306/x
          -e 'CORS_ORIGINS=["https://example.vercel.app"]'
          worth-joining-api
          python -c "from app.main import app; from app.core.config import settings; print(len(app.routes), settings.cors_origins)"

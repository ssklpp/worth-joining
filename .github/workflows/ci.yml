name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # latest가 10/19부터 Ubuntu 26으로 바뀌어 기간 중 고정
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: worth_joining_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql+asyncmy://root:test@127.0.0.1:3306/worth_joining_test
      DATABASE_URL_SYNC: mysql+pymysql://root:test@127.0.0.1:3306/worth_joining_test
      TEST_DATABASE_URL: mysql+asyncmy://root:test@127.0.0.1:3306/worth_joining_test
      DB_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic heads
      - run: pytest -v

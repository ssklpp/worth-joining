[project]
name = "worth-joining"
version = "0.1.0"
description = "다닐만한가: 공공데이터로 보는 회사 체력"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # 수집 · 가공 (SPEC 1장)
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "pyproj>=3.6",
    "APScheduler>=3.10,<4",
    # DB
    "SQLAlchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "PyMySQL>=1.1",
    "alembic>=1.13",
    # 백엔드
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "locust>=2.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
